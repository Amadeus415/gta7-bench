<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halcyon Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f18; font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; color: #fff; }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }
  .panel { background: rgba(8, 12, 22, 0.55); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; backdrop-filter: blur(4px); }
  #topleft { position: absolute; left: 16px; top: 14px; padding: 10px 14px; min-width: 170px; }
  #topleft .title { font-weight: 800; letter-spacing: 3px; font-size: 13px; color: #7fe3ff; text-shadow: 0 0 8px rgba(80,200,255,0.6); }
  #clock { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  #money { font-size: 20px; font-weight: 700; color: #8dff9a; font-variant-numeric: tabular-nums; }
  #stars { font-size: 20px; letter-spacing: 2px; height: 24px; color: #555; }
  #stars .on { color: #ffd23f; text-shadow: 0 0 6px #ffb300; }
  #stars.blink .on { animation: blink 0.5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #mission { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 10px 18px; text-align: center; font-size: 16px; max-width: 520px; display: none; }
  #mission .timer { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #mission .timer.low { color: #ff6464; }
  #toast { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 700; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity 0.3s; text-align: center; }
  #big { position: absolute; top: 34%; left: 0; right: 0; text-align: center; font-size: 64px; font-weight: 900; letter-spacing: 6px; opacity: 0; transition: opacity 0.4s; text-shadow: 0 4px 18px rgba(0,0,0,0.8); }
  #big small { display: block; font-size: 20px; letter-spacing: 2px; font-weight: 700; }
  #minimapWrap { position: absolute; left: 16px; bottom: 16px; width: 210px; height: 210px; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255,255,255,0.75); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  #minimap { width: 210px; height: 210px; }
  #location { position: absolute; left: 236px; bottom: 20px; font-size: 15px; font-weight: 700; text-shadow: 0 2px 4px #000; }
  #speedo { position: absolute; right: 16px; bottom: 16px; width: 190px; height: 190px; display: none; }
  #help { position: absolute; right: 16px; top: 14px; padding: 10px 14px; font-size: 13px; line-height: 1.55; }
  #help b { display: inline-block; min-width: 46px; padding: 0 5px; margin-right: 6px; border-radius: 4px; background: rgba(255,255,255,0.16); text-align: center; font-weight: 700; }
  #help .head { font-weight: 800; color: #7fe3ff; letter-spacing: 2px; font-size: 11px; margin-bottom: 4px; }
  #prompt { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: 700; padding: 6px 14px; display: none; }
  #prompt b { color: #ffd23f; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="topleft" class="panel">
    <div class="title">HALCYON BAY</div>
    <div id="clock">11:00</div>
    <div id="money">$0</div>
    <div id="stars"></div>
  </div>
  <div id="mission" class="panel"></div>
  <div id="toast"></div>
  <div id="big"></div>
  <div id="prompt" class="panel"></div>
  <div id="minimapWrap"><canvas id="minimap" width="420" height="420"></canvas></div>
  <div id="location"></div>
  <canvas id="speedo" width="380" height="380"></canvas>
  <div id="help" class="panel"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
